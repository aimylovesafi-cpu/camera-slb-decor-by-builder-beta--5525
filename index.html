<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#FF1493">

    <title>Camera SLB decor by Builder Beta</title>

    <script>
        // Add event listener to buttons
        const buttons = document.querySelectorAll('button');
